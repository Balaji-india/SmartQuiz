services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartquiz
      POSTGRES_PASSWORD: smartquiz
      POSTGRES_DB: smartquiz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartquiz -d smartquiz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
